<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/schedule.css">
    <script src="../assets/js/scripts.js" defer></script>
    <title>VitaSync - Agenda</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="nav">
        <div class="nav__left">
            <p class="logo">Vita<strong>Sync</strong></p>

            <ul class="nav__links">
                <li><a href="#" class="nav__link nav__link--active">Agenda</a></li>
                <li><a href="#" class="nav__link">Clientes</a></li>
                <li><a href="#" class="nav__link">Procedimentos</a></li>
            </ul>
        </div>

        <p class="nav__user">Olá, Recepção</p>
    </nav>
    <main class="schedule">
        <div class="schedule__controls">
            <div class="schedule__controls-left">
                <div class="schedule__toggle">
                    <button type="button" class="schedule__toggle-option schedule__toggle-option--active">Dia</button>
                    <button type="button" class="schedule__toggle-option">Semana</button>
                </div>

                <div class="date-nav">
                    <button type="button" class="date-nav__arrow" aria-label="Dia anterior">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-left preview-icon"><path d="m15 18-6-6 6-6"/></svg>
                    </button>

                    <h1 class="date-nav__current">Segunda, 21/09</h1>

                    <button type="button" class="date-nav__arrow" aria-label="Dia seguinte">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-chevron-right preview-icon"><path d="m9 18 6-6-6-6"/></svg>
                    </button>
                </div>
            </div>

            <button class="btn btn--sm" type="button">+ Agendamento</button>
        </div>

        <div class="schedule__board">
            <div class="schedule__corner"></div>

            <div class="schedule__professionals">
                <div class="schedule__professional">
                    <p>Dra. Paula</p>
                </div>
                
                <div class="schedule__professional">
                    <p>Dr. Marcos</p>
                </div>

                <div class="schedule__professional">
                    <p>Est. Carla</p>
                </div>
            </div>

            <div class="schedule__hours">
                <time class="schedule__hour">07:00</time>
                <time class="schedule__hour">08:00</time>
                <time class="schedule__hour">09:00</time>
                <time class="schedule__hour">10:00</time>
                <time class="schedule__hour">11:00</time>
                <time class="schedule__hour">12:00</time>
                <time class="schedule__hour">13:00</time>
                <time class="schedule__hour">14:00</time>
                <time class="schedule__hour">15:00</time>
                <time class="schedule__hour">16:00</time>
                <time class="schedule__hour">17:00</time>
            </div>

            <div class="schedule__columns">
                <div class="schedule__column" data-professional="1"></div>
                <div class="schedule__column" data-professional="2"></div>
                <div class="schedule__column" data-professional="3"></div>
            </div>
        </div>
    </main>
</body>
</html>
